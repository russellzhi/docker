upstream php85_backend {
    zone php85_backend 64k;
    server php85:9000 resolve;
}

server {
    listen 8003;
    server_name localhost 127.0.0.1 demo3.com;
    root /var/www/html/demo3.com;
    index index.php index.html;
    charset utf-8;
    access_log /var/log/nginx/demo3-access.log main;
    error_log /var/log/nginx/demo3-error.log warn;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php85_backend;
    }

    location ~* \.(gif|jpg|jpeg|png|webp|svg|ico|css|js)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
