server {
    listen 80;
    listen 8001;
    server_name demo1.com;
    root /var/www/html/demo1.com;
    index index.php index.html;
    charset utf-8;
    access_log /var/log/nginx/demo1-access.log main;
    error_log /var/log/nginx/demo1-error.log warn;

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php56;
    }

    location ~* \.(gif|jpg|jpeg|png|webp|svg|ico|css|js)$ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }
}
