services:
  nginx:
    container_name: nginx
    image: nginx:1.30.4
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
      - "127.0.0.1:8003:8003"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./html:/var/www/html:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      php56:
        condition: service_healthy
      php74:
        condition: service_healthy
      php86:
        condition: service_healthy
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  php56:
    container_name: php56
    build:
      context: ./php
      dockerfile: php56/Dockerfile
    # Allow PHP-FPM to collect slow-request stack traces in this local environment.
    cap_add: [SYS_PTRACE]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    working_dir: /var/www/html
    environment:
      DEMO_DB_HOST: mysql
      DEMO_DB_NAME: demo
      DEMO_DB_USER: demo
      DEMO_DB_PASSWORD: ${MYSQL_PASSWORD:-demo_local_password}
    volumes:
      - ./html:/var/www/html
      - ./php/common.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./php/browscap.ini:/usr/local/etc/php/browscap.ini:ro
      - ./php/fpm-logging.conf:/usr/local/etc/php-fpm.d/zzz-logging.conf:ro
      - ./logs/php56:/var/log/php
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
  php74:
    container_name: php74
    build:
      context: ./php
      dockerfile: php74/Dockerfile
    # Allow PHP-FPM to collect slow-request stack traces in this local environment.
    cap_add: [SYS_PTRACE]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    working_dir: /var/www/html
    environment:
      DEMO_DB_HOST: mysql
      DEMO_DB_NAME: demo
      DEMO_DB_USER: demo
      DEMO_DB_PASSWORD: ${MYSQL_PASSWORD:-demo_local_password}
    volumes:
      - ./html:/var/www/html
      - ./php/common.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./php/browscap.ini:/usr/local/etc/php/browscap.ini:ro
      - ./php/fpm-logging.conf:/usr/local/etc/php-fpm.d/zzz-logging.conf:ro
      - ./logs/php74:/var/log/php
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
  php86:
    container_name: php86
    build:
      context: ./php
      dockerfile: php86/Dockerfile
    # Allow PHP-FPM to collect slow-request stack traces in this local environment.
    cap_add: [SYS_PTRACE]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    working_dir: /var/www/html
    environment:
      DEMO_DB_HOST: mysql
      DEMO_DB_NAME: demo
      DEMO_DB_USER: demo
      DEMO_DB_PASSWORD: ${MYSQL_PASSWORD:-demo_local_password}
    volumes:
      - ./html:/var/www/html
      - ./php/common.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./php/browscap.ini:/usr/local/etc/php/browscap.ini:ro
      - ./php/fpm-logging.conf:/usr/local/etc/php-fpm.d/zzz-logging.conf:ro
      - ./logs/php86:/var/log/php
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
  mysql:
    container_name: mysql
    image: mysql:8.0.46
    entrypoint: ["sh", "/usr/local/bin/project-mysql-entrypoint.sh"]
    command: ["mysqld"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-demo_local_password}
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
      - ./mysql/entrypoint.sh:/usr/local/bin/project-mysql-entrypoint.sh:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u demo -D demo -e 'SELECT 1 FROM demo1 LIMIT 1; SELECT 1 FROM demo2 LIMIT 1; SELECT 1 FROM demo3 LIMIT 1;' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    logging: *logging
