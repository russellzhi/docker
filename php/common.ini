date.timezone = Asia/Shanghai
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log
memory_limit = 256M

upload_max_filesize = 32M
post_max_size = 40M
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

browscap = /usr/local/etc/php/browscap.ini
